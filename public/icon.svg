<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Outer Ring / Orbit -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Topographic Prism / Reticle Shape -->
  <polygon points="256,90 380,310 132,310" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linejoin="round" />
  
  <!-- Central Target / Drone Core -->
  <circle cx="256" cy="235" r="42" fill="url(#blueGrad)" />
  <circle cx="256" cy="235" r="20" fill="#ffffff" />

  <!-- Crosshairs -->
  <line x1="256" y1="140" x2="256" y2="190" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="280" x2="256" y2="330" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="235" x2="210" y2="235" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="302" y1="235" x2="352" y2="235" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Base Station / Tripod Indicator -->
  <line x1="170" y1="360" x2="256" y2="310" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="342" y1="360" x2="256" y2="310" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="310" x2="256" y2="380" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Text Branding -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">M&amp;B</text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="6">EQUIPAMENTOS</text>
</svg>
